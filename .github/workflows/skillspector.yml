# Scans the files that instruct AI agents in this repo (CLAUDE.md, AGENTS.md, .claude/,
# .mcp.json, skills) with NVIDIA SkillSpector before a change to them merges.
# Why: an agent obeys these files with the repo's full trust, so a poisoned skill, hook or
# instruction is a supply-chain attack on every session that opens the repo.
#
# Static analysis only (--no-llm): no file content is sent to any model provider.
# Fails when the risk score is above 50 (SkillSpector's own threshold). The static
# patterns match words, not intent, so read a finding before acting on it; to accept a
# reviewed finding, commit a baseline (`skillspector baseline <dir> -o
# .github/skillspector-baseline.json`) and this workflow applies it.
name: skillspector

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".mcp.json"
      - ".claude/**"
      - ".claude-plugin/**"
      - ".cursor/rules/**"
      - "**/SKILL.md"
      - "**/skills/**"
      - ".github/workflows/skillspector.yml"
      - ".github/skillspector-baseline.json"
  push:
    branches: [main, master]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".mcp.json"
      - ".claude/**"
      - ".claude-plugin/**"
      - ".cursor/rules/**"
      - "**/SKILL.md"
      - "**/skills/**"
      - ".github/workflows/skillspector.yml"
      - ".github/skillspector-baseline.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to a reviewed commit: a scanner installed from a moving branch is itself
      # a supply-chain risk. Bump deliberately.
      SKILLSPECTOR_REF: f9bb13dd1667eb4e7ac97b8ebace3160041ed571
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Collect agent-facing files
        id: stage
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agent-files"
          mkdir -p "$dest"
          {
            git ls-files -- CLAUDE.md AGENTS.md .mcp.json '.claude/**' '.claude-plugin/**' '.cursor/rules/**'
            git ls-files -- '**/SKILL.md' | xargs -r -n1 dirname | sort -u | xargs -r git ls-files --
          } | grep -v '/node_modules/' | sort -u > "$RUNNER_TEMP/files.txt" || true
          while IFS= read -r f; do
            mkdir -p "$dest/$(dirname "$f")"
            cp "$f" "$dest/$f"
          done < "$RUNNER_TEMP/files.txt"
          count=$(wc -l < "$RUNNER_TEMP/files.txt")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"
          echo "Agent-facing files: $count"

      - name: Nothing to scan
        if: steps.stage.outputs.count == '0'
        run: echo "No agent-facing files in this repo; nothing to scan." >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.stage.outputs.count != '0'

      - name: Install SkillSpector
        if: steps.stage.outputs.count != '0'
        run: uv tool install --python 3.13 "git+https://github.com/NVIDIA/SkillSpector.git@${SKILLSPECTOR_REF}"

      - name: Scan
        if: steps.stage.outputs.count != '0'
        env:
          SCAN_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -uo pipefail
          args=(scan "$SCAN_DIR" --no-llm --format json --output "$RUNNER_TEMP/skillspector.json")
          if [ -f .github/skillspector-baseline.json ]; then
            args+=(--baseline .github/skillspector-baseline.json)
          fi
          skillspector "${args[@]}"
          code=$?
          python3 - "$RUNNER_TEMP/skillspector.json" "$SCAN_DIR" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          path, root = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open(path))
          except Exception as exc:
              print(f"## SkillSpector\n\nNo report was written ({exc}). See the job log.")
              sys.exit(0)
          r = d.get("risk_assessment") or {}
          c = d.get("analysis_completeness") or {}
          print("## SkillSpector")
          print()
          print(f"Risk score **{r.get('score')}** ({r.get('severity')}, {r.get('recommendation')}); "
                f"coverage {c.get('coverage_percent')}%; the check fails above 50.")
          print()
          issues = d.get("issues") or []
          if not issues:
              print("No findings.")
          else:
              print("| Severity | Rule | File | Line | Match |")
              print("|---|---|---|---|---|")
              for i in issues:
                  loc = i.get("location") or {}
                  match = str(i.get("finding", ""))[:100].replace("|", "\\|").replace("\n", " ")
                  print(f"| {i.get('severity')} | {i.get('id')} {i.get('pattern')} | "
                        f"`{loc.get('file')}` | {loc.get('start_line')} | {match} |")
          for x in c.get("ledger_exceptions") or []:
              print(f"\nNot fully inspected: `{x.get('path')}` ({x.get('reason_code')}).")
          PY
          exit $code

      - name: Upload report
        if: always() && steps.stage.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillspector-report
          path: ${{ runner.temp }}/skillspector.json
          if-no-files-found: ignore
          retention-days: 14
