# Scans the files that instruct AI agents in this repo with NVIDIA SkillSpector before a change
# to them merges: CLAUDE.md, CLAUDE.local.md, AGENTS.md and .mcp.json at any depth, every
# .claude/, .claude-plugin/, skills/ and .cursor/rules/ directory (names matched in any case,
# symlinked ones followed), each skill's whole directory, and the files CLAUDE.md-style files
# pull in with @imports.
# Why: an agent obeys these files with the repo's full trust, so a poisoned skill, hook or
# instruction is a supply-chain attack on every session that opens the repo.
#
# Static analysis only (--no-llm): no file content is sent to any model provider.
# Fails when the risk score is above 50 (SkillSpector's own threshold), when the scan errors,
# or when an agent-facing file could not be scanned (a symlink or @import out of the repo,
# or a submodule).
#
# Pull requests run under pull_request_target, so the workflow that judges a PR is the one on
# the base branch: a PR cannot weaken or remove its own check by editing this file. In
# exchange, nothing from the PR is ever executed here: its files are only listed with git,
# copied and read by the scanner. Keep it that way; never run, install or source anything
# from repo/. Permissions stay read-only and no secret is used.
#
# The static patterns match words, not intent, so read a finding before acting on it. To
# accept a reviewed finding, merge a baseline to the default branch first: copy the
# agent-facing files into a directory at their repo-relative paths (as the Collect step
# below does) and run
#   skillspector baseline <that dir> --no-llm -o .github/skillspector-baseline.json
# On a pull request the baseline is read from the base branch, never from the PR.
name: skillspector

on:
  # No path filter: a skill's scripts can live anywhere, and a symlink can point an
  # agent-facing path at any file, so every PR is checked. With no agent files it takes
  # seconds.
  pull_request_target:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false

      - name: Check out base-branch baseline
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          sparse-checkout: .github/skillspector-baseline.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Collect agent-facing files
        id: stage
        working-directory: repo
        run: |
          python3 -I - "$RUNNER_TEMP/agent-files" "$GITHUB_OUTPUT" "$RUNNER_TEMP/skipped.txt" <<'PY'
          # Copies every agent-facing file of the repo in the working directory to the staging dir,
          # at its repo-relative path. Works from the full tracked-file list (NUL-separated, with
          # modes), so no file name can break it and nothing is matched by a pattern a PR can dodge.
          import os, re, shutil, subprocess, sys
          dest, out, skipped_path = sys.argv[1:4]
          root = os.path.realpath(".")

          # Compared in lower case: macOS disks are case-insensitive, so `claude.md` or `.Claude/`
          # load there just as `CLAUDE.md` and `.claude/` do.
          AGENT_DIRS = {".claude", ".claude-plugin", "skills"}
          AGENT_FILES = {"claude.md", "claude.local.md", "agents.md", ".mcp.json", "skill.md"}
          IMPORTERS = {"claude.md", "claude.local.md", "agents.md"}

          raw = subprocess.run(["git", "ls-files", "-s", "-z"], check=True, capture_output=True).stdout
          modes = {}
          for rec in os.fsdecode(raw).split("\0"):
              if rec:
                  meta, path = rec.split("\t", 1)
                  modes[path] = meta.split()[0]

          def parts(p):
              return [c.lower() for c in p.split("/")]

          def agent_facing(p):
              ps = parts(p)
              if ps[-1] in AGENT_FILES:
                  return True
              # A path inside an agent dir, or the dir entry itself when it is a symlink.
              if any(c in AGENT_DIRS for c in ps):
                  return True
              return any(ps[i] == ".cursor" and ps[i + 1] == "rules" for i in range(len(ps) - 1))

          selected = {p for p in modes if agent_facing(p)}
          # A skill is its whole directory: scripts beside SKILL.md run with it.
          for p in list(modes):
              d = os.path.dirname(p)
              if parts(p)[-1] == "skill.md" and d:
                  selected.update(q for q in modes if q.startswith(d + "/"))

          skipped = []

          # CLAUDE.md-style files pull in other files with `@path` imports, recursively; the imported
          # files reach the agent too, so they are scanned. Code spans and blocks are not imports.
          FENCE = re.compile(r"```.*?```|~~~.*?~~~", re.S)
          INLINE = re.compile(r"`[^`\n]*`")
          IMPORT = re.compile(r"(?<![\w@`/])@([^\s`)\]>,;\"']+)")
          queue = [(p, 0) for p in sorted(selected) if parts(p)[-1] in IMPORTERS]
          done = set()
          while queue:
              p, depth = queue.pop()
              real = os.path.realpath(p)
              if p in done or depth > 5 or not os.path.isfile(real):
                  continue
              done.add(p)
              text = open(real, encoding="utf-8", errors="replace").read()
              text = INLINE.sub("", FENCE.sub("", text))
              for m in IMPORT.finditer(text):
                  ref = m.group(1)
                  if ref.startswith("~"):
                      continue  # the reader's home directory, not repo content
                  for cand in (ref, ref.rstrip(".:")):
                      target = os.path.normpath(cand if os.path.isabs(cand)
                                                else os.path.join(os.path.dirname(p), cand))
                      if os.path.isabs(target) or target.startswith(".."):
                          # Leaves the repo: on a developer's machine it could load any file.
                          skipped.append(f"{p} imports @{cand}, outside the repo")
                          break
                      if target in modes:
                          selected.add(target)
                          if target.lower().endswith(".md"):
                              queue.append((target, depth + 1))
                          break

          staged = set()
          visited = set()

          def inside(real):
              return (real == root or real.startswith(root + os.sep)) and \
                  not (real + os.sep).startswith(os.path.join(root, ".git") + os.sep)

          def stage(src, rel):
              real = os.path.realpath(src)
              if not inside(real):
                  skipped.append(rel)
              elif os.path.isfile(real):
                  target = os.path.join(dest, rel)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  shutil.copyfile(real, target)
                  staged.add(rel)
              elif os.path.isdir(real):
                  # Every link below is followed through the same check, so a link out of the repo
                  # anywhere under an agent dir is caught; `visited` stops link loops.
                  if real in visited:
                      return
                  visited.add(real)
                  for name in sorted(os.listdir(real)):
                      if real == root and name == ".git":
                          continue
                      stage(os.path.join(real, name), f"{rel}/{name}")
              else:
                  skipped.append(rel)

          for p in sorted(selected):
              if modes.get(p) == "160000":
                  # A submodule checks out empty here but is fetched by anyone cloning recursively.
                  skipped.append(f"{p} (submodule)")
              else:
                  stage(os.path.join(root, p), p)

          with open(skipped_path, "w") as fh:
              fh.writelines(s + "\n" for s in skipped)
          with open(out, "a") as fh:
              fh.write(f"count={len(staged)}\nskipped={len(skipped)}\ndir={dest}\n")
          print(f"Agent-facing files: {len(staged)} staged, {len(skipped)} could not be scanned")
          PY

      - name: Nothing to scan
        if: steps.stage.outputs.count == '0' && steps.stage.outputs.skipped == '0'
        run: echo "No agent-facing files in this repo; nothing to scan." >> "$GITHUB_STEP_SUMMARY"

      # The scanner is pinned to a reviewed commit and installed from that commit's own
      # uv.lock, so neither it nor its dependencies move between runs. Its build backend
      # (hatchling) is installed first from the same lock with hashes required, and the
      # build uses it rather than resolving a fresh one. Bump deliberately.
      - name: Check out SkillSpector
        if: steps.stage.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/SkillSpector
          ref: f9bb13dd1667eb4e7ac97b8ebace3160041ed571
          path: skillspector
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.stage.outputs.count != '0'
        with:
          # uv itself is pinned like everything else; no cache, so a PR's run never writes
          # one into the base branch's cache scope.
          version: "0.13.10"
          enable-cache: false

      - name: Install SkillSpector
        if: steps.stage.outputs.count != '0'
        run: |
          python3 -I - skillspector/uv.lock "$RUNNER_TEMP/build-constraints.txt" <<'PY'
          # Pins the build backend and its dependencies, with hashes, from the scanner's lock.
          import sys, tomllib
          lock = tomllib.load(open(sys.argv[1], "rb"))
          pkgs = {p["name"]: p for p in lock["package"]}
          todo, seen = ["hatchling"], []
          while todo:
              n = todo.pop()
              if n not in seen:
                  seen.append(n)
                  todo += [d["name"] for d in pkgs[n].get("dependencies", [])]
          with open(sys.argv[2], "w") as fh:
              for n in sorted(seen):
                  p = pkgs[n]
                  hashes = [w["hash"] for w in p.get("wheels", [])]
                  if "sdist" in p:
                      hashes.append(p["sdist"]["hash"])
                  fh.write(f"{n}=={p['version']} " + " ".join(f"--hash={h}" for h in hashes) + "\n")
          PY
          uv venv skillspector/.venv --python 3.13.18
          uv pip install --python skillspector/.venv --require-hashes -r "$RUNNER_TEMP/build-constraints.txt"
          uv sync --project skillspector --frozen --no-dev --inexact --no-editable \
            --no-build-isolation-package skillspector

      - name: Scan
        if: steps.stage.outputs.count != '0'
        env:
          SCAN_DIR: ${{ steps.stage.outputs.dir }}
          BASELINE: ${{ github.event_name == 'pull_request_target' && 'base/.github/skillspector-baseline.json' || 'repo/.github/skillspector-baseline.json' }}
        run: |
          set -uo pipefail
          args=(scan "$SCAN_DIR" --no-llm --format json --output "$RUNNER_TEMP/skillspector.json")
          if [ -f "$BASELINE" ]; then
            args+=(--baseline "$BASELINE")
          fi
          # GitHub runs this step with `bash -e`; capture the exit code so the summary is
          # still written when the scan fails, which is when it matters most.
          code=0
          uv run --project skillspector --frozen --no-dev --no-sync skillspector "${args[@]}" || code=$?
          python3 -I - "$RUNNER_TEMP/skillspector.json" "$code" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          path, code = sys.argv[1], sys.argv[2]
          print("## SkillSpector")
          print()
          try:
              d = json.load(open(path))
          except Exception as exc:
              print(f"No report was written (exit {code}: {exc}). See the job log.")
              sys.exit(0)
          r = d.get("risk_assessment") or {}
          c = d.get("analysis_completeness") or {}
          print(f"Risk score **{r.get('score')}** ({r.get('severity')}, {r.get('recommendation')}); "
                f"coverage {c.get('coverage_percent')}%; exit {code}. The check fails above 50.")
          print()
          issues = d.get("issues") or []
          if not issues:
              print("No findings.")
          else:
              print("| Severity | Rule | File | Line | Match |")
              print("|---|---|---|---|---|")
              for i in issues:
                  loc = i.get("location") or {}
                  match = str(i.get("finding", ""))[:100].replace("|", "\\|").replace("\n", " ")
                  print(f"| {i.get('severity')} | {i.get('id')} {i.get('pattern')} | "
                        f"`{loc.get('file')}` | {loc.get('start_line')} | {match} |")
          for x in c.get("ledger_exceptions") or []:
              print(f"\nNot fully inspected: `{x.get('path')}` ({x.get('reason_code')}).")
          PY
          exit "$code"

      # Runs even when nothing else was scanned, so an agent file that is only a symlink out
      # of the repo still fails the check instead of passing as "nothing to scan".
      - name: Fail on files that could not be scanned
        if: always() && steps.stage.outputs.skipped != '0' && steps.stage.outputs.skipped != ''
        run: |
          {
            echo "## Agent-facing files that could not be scanned"
            echo
            echo "An agent reads these, but each is a symlink out of the repo, a dangling link or"
            echo "not a regular file, so its content is unknown. Replace it with a real file in the repo."
            echo
            sed 's/.*/- `&`/' "$RUNNER_TEMP/skipped.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload report
        if: always() && steps.stage.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillspector-report
          path: ${{ runner.temp }}/skillspector.json
          if-no-files-found: ignore
          retention-days: 14
